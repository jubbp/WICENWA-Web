<header class="site-header">
  <div class="header-content">
    <div class="logo-section">
      <a href="/" class="logo-link">
        <img src="/assets/WicenLogoBlackYellowTrans.png" alt="WICEN WA Logo" class="logo-image">
        <div>
          <div class="site-title">{{ site.title }}</div>
          <div class="site-subtitle">{{ site.subtitle }}</div>
        </div>
      </a>
    </div>

    <button class="hamburger-menu" id="hamburger-toggle" aria-label="Toggle navigation menu">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <nav class="main-nav" id="mobile-menu">
      <ul class="nav-list">
        <li><a href="/" class="nav-link">Home</a></li>
        <li><a href="/get-involved" class="nav-link">Get Involved</a></li>
        <li><a href="/future-events" class="nav-link">Future Events</a></li>
        <li><a href="/members" class="nav-link">Members</a></li>
        <li><a href="/news" class="nav-link">News</a></li>
        <li><a href="/contact" class="nav-link">Contact Us</a></li>
      </ul>
    </nav>

    <div class="header-actions">
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Switch to light mode" title="Switch to light mode">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </div>
  </div>
</header>

<script>
  const hamburger = document.getElementById('hamburger-toggle');
  const menu = document.getElementById('mobile-menu');

  hamburger.addEventListener('click', function() {
    menu.classList.toggle('active');
    hamburger.classList.toggle('active');
  });

  // Close menu when a link is clicked
  document.querySelectorAll('.nav-link').forEach(link => {
    link.addEventListener('click', function() {
      menu.classList.remove('active');
      hamburger.classList.remove('active');
    });
  });

  // Dark / light theme toggle (dark is the default)
  const themeToggle = document.getElementById('theme-toggle');
  const themeColorMeta = document.querySelector('meta[name="theme-color"]');

  function applyTheme(theme) {
    const isLight = theme === 'light';
    if (isLight) {
      document.documentElement.setAttribute('data-theme', 'light');
    } else {
      document.documentElement.removeAttribute('data-theme');
    }
    const label = isLight ? 'Switch to dark mode' : 'Switch to light mode';
    themeToggle.setAttribute('aria-label', label);
    themeToggle.setAttribute('title', label);
    if (themeColorMeta) themeColorMeta.setAttribute('content', isLight ? '#f4f0e6' : '#151515');
  }

  applyTheme(document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark');

  themeToggle.addEventListener('click', function() {
    const next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    applyTheme(next);
    try { localStorage.setItem('theme', next); } catch (e) {}
  });
</script>
