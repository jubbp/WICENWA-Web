# WICEN-WA Operations Manual — revision control.
#
# The manual is compiled from the PACE plan pages by _tools/manual/build_manual.py.
# To issue a new revision: add an entry at the TOP of `revisions`, then rebuild.
# The first entry is the current revision; it appears in every page footer.
#
# The manual is also downloadable from the website
# (assets/manual/WICEN-WA-Operations-Manual.pdf, linked from the PACE Overview and
# Member Info pages). Whenever the manual is republished, the website copy must be
# replaced with the current version too: issue it with `tools/export.py manual` in
# WICENWA-Records, which writes the same PDF to Drive and to this repository, then
# commit and push. Never update the website PDF any other way.

title: WICEN-WA Operations Manual
